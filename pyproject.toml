[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextpacker"
version = "0.2.0"
description = "Pack and truncate context windows for LLM prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["llm", "context", "tokenization", "prompt engineering", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gui = ["streamlit>=1.28"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
contextpacker-gui = "contextpacker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contextpacker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/contextpacker"]
omit = ["src/contextpacker/gui.py", "src/contextpacker/__main__.py"]
